<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>block element</title>
  </head>
  <body>
    <h1 style="text-align: center">Block Elements</h1>

    <!-- block level elements -->

    <!-- block level elements will occupy full width and always start with new line -->

    <!-- heading tags -->
    <h1>heading 1</h1>
    <h2>heading 2</h2>
    <h3>heading 3</h3>
    <h4>heading 4</h4>
    <h5>heading 5</h5>
    <h6>heading 6</h6>

    <!-- paragraph tag -->

    <p>this is some paragraph</p>

    <!-- horizontal rule -->

    <hr />

    <!-- break line -->
    <br />

    
  </body>
</html>
