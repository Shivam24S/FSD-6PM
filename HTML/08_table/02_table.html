<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>table</title>
    <style>
      table,
      th,
      tr,
      td {
        border: 1px solid black;
      }
    </style>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th rowspan="2">Heading</th>
          <th>Students</th>
          <th colspan="3">Details</th>
        </tr>
        <tr>
          <th>id</th>
          <th>Name</th>
          <th>Department</th>
          <th>Roll no</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td rowspan="4">Student List</td>
          <td>1</td>
          <td>tokyo</td>
          <td>computer Science</td>
          <td>1234</td>
        </tr>
        <tr>
          <td>2</td>
          <td>Denver</td>
          <td>Electronics</td>
          <td>12345</td>
        </tr>
        <tr>
          <td>3</td>
          <td>berlin</td>
          <td>communication</td>
          <td>54321</td>
        </tr>
        <tr>
          <td>4</td>
          <td>nairobi</td>
          <td>social science</td>
          <td>98765</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
