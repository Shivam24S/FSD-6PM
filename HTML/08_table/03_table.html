<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>table 3</title>

    <style>
      table,
      th,
      tr,
      td {
        border-style: ridge;
        padding: 20px;
        /* border-spacing: 20px; */
      }
    </style>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th rowspan="3">Day</th>
          <th colspan="3">seminar</th>
        </tr>
        <tr>
          <th colspan="2">schedule</th>
          <th rowspan="2">Topic</th>
        </tr>
        <tr>
          <th>Begin</th>
          <th>End</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td rowspan="2">Monday</td>
          <td rowspan="2">8:00 Am</td>
          <td rowspan="2">5:00 Pm</td>
          <td>Introduction to XML</td>
        </tr>
        <tr>
          <td>validity</td>
        </tr>
        <tr>
          <td rowspan="3">TuesDay</td>
          <td>8</td>
          <td>11</td>
          <td>x path</td>
        </tr>
        <tr>
          <td>11</td>
          <td>2</td>
          <td rowspan="2">XSL</td>
        </tr>
        <tr>
          <td>2</td>
          <td>5</td>
        </tr>
        <tr>
          <td>wednesday</td>
          <td>8</td>
          <td>12</td>
          <td>XSL formatting</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
