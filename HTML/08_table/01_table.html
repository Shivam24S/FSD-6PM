<!-- we are using tables when we want to show our data in structured format -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>table</title>

    <style>
      table,
      th,
      tr,
      td {
        border: 1px solid black;
      }
    </style>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th>No</th>
          <th>FullName</th>
          <th>Position</th>
          <th>Salary</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>Bill gates</td>
          <td>Founder microsoft</td>
          <td>$1000</td>
        </tr>
        <tr>
          <td>2</td>
          <td>steve jobs</td>
          <td>Apple</td>
          <td>$1000</td>
        </tr>
        <tr>
          <td>3</td>
          <td>larry page</td>
          <td>google</td>
          <td>$1000</td>
        </tr>
        <tr>
          <td>4</td>
          <td>mark zuckerberg</td>
          <td>facebook</td>
          <td>$1000</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
