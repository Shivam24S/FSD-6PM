<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>inline elements</title>
  </head>
  <body>
    <h1 style="text-align: center">Inline Elements</h1>

    <!-- inline elements -->

    <!-- inline elements will occupy space only which required and it will  not start with new line -->

    <!-- inline elements -->

    <i>this is italic text</i>

    <br />

    <i>this is another italic text</i>

    <br />

    <b>this is bold text</b>

    <br />

    <u>this is underline</u>

    <!-- now visually same but it has more precedence -->

    <br />

    <strong>this is strong text</strong>

    <br />

    <em>this is emphasize text</em>
  </body>
</html>
